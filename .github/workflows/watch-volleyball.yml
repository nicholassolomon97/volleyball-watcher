name: Watch NYC pickup volleyball listings

on:
  schedule:
    - cron: '2-59/5 * * * *'   # every 5 minutes, offset to avoid top-of-hour congestion
  workflow_dispatch: {}

permissions:
  contents: write        # lets the workflow commit the saved state back to the repo

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Check for new/removed games
        env:
          # No venues= filter here - fetches every pickup volleyball
          # listing citywide, and every game notifies the same way (new +
          # reopened spots), all on one topic. PRIORITY_VENUES only decides
          # which ones get a ⭐ in the title - no difference in loudness,
          # topic, or anything else.
          TARGET_URL: "https://www.volosports.com/discover/new-york-metro-area?category=daily-sports&programType=pickup&sports=volleyball"

          # Comma-separated venue slugs (no spaces needed around commas -
          # they're trimmed). Edit anytime, just change the value and
          # commit. To find a venue's slug: open the Volosports site,
          # filter to just that venue, and copy the value after "venues="
          # in the URL.
          PRIORITY_VENUES: "avenues,baruch-college,the-post-bk-100-dobbin-st,the-post-53-knickerbocker-ave,xavier-high-school"

          NTFY_TOPIC: "nick-volo-pickup-8x2q"   # <-- change this to your own topic
        run: python3 scripts/check_volleyball.py

      - name: Commit updated state
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add volleyball_state.json
            git commit -m "Update saved volleyball listing state"
            git push
          else
            echo "No changes to commit."
          fi
